<script>
/* ===================== 音频 ===================== */
let audioCtx=null, soundOn=true, bgmOsc=null, bgmGain=null, bgmLfo=null;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function beep(freq=600,dur=0.08,type='sine',vol=0.07){
  if(!soundOn) return; initAudio();
  try{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function clickSound(){ beep(720,0.05,'triangle',0.05); }
function heartSound(){ if(!soundOn)return; beep(130,0.16,'sine',0.11); setTimeout(()=>beep(105,0.22,'sine',0.09),145); }
function tenseSound(){ if(!soundOn)return; beep(90,0.35,'sawtooth',0.05); }
function goodSound(){ if(!soundOn)return; [660,880,1100].forEach((f,i)=>setTimeout(()=>beep(f,0.25,'sine',0.08),i*130)); }
function startBGM(){
  if(!soundOn) return; initAudio(); if(bgmOsc) return;
  try{
    bgmOsc=audioCtx.createOscillator(); bgmGain=audioCtx.createGain();
    bgmOsc.type='sine'; bgmOsc.frequency.value=196;
    bgmGain.gain.value=0.018;
    bgmOsc.connect(bgmGain); bgmGain.connect(audioCtx.destination); bgmOsc.start();
    bgmLfo=audioCtx.createOscillator(); const lg=audioCtx.createGain();
    bgmLfo.frequency.value=0.12; lg.gain.value=0.007;
    bgmLfo.connect(lg); lg.connect(bgmGain.gain); bgmLfo.start();
  }catch(e){}
}
function stopBGM(){ if(bgmOsc){ try{bgmOsc.stop()}catch(e){} bgmOsc=null; } if(bgmLfo){ try{bgmLfo.stop()}catch(e){} bgmLfo=null; } }

/* ===================== 语气引擎 ===================== */
const TONE = {
  soft: ['温柔','轻声','小声','慢慢','轻轻','抱','牵','吻','陪','照顾'],
  cold: ['冷','淡','随便','无所谓','算了','不必','不用','懒得','走了','别了'],
  angry: ['滚','烦','讨厌','恨','别碰','走开','闭嘴','凭什么'],
  sad: ['哭','难过','伤心','舍不得','想哭','委屈','后悔','如果'],
  tease: ['哼','才不','谁说','你猜','偏不','逗你','活该'],
  sincere: ['认真','真的','确定','想清楚','不后悔','愿意','一起']
};
function analyzeTone(text){
  const t = text.toLowerCase();
  const hits = {};
  Object.keys(TONE).forEach(k=>{ hits[k] = TONE[k].filter(w=>t.includes(w)).length; });
  let best='normal', max=0;
  Object.keys(hits).forEach(k=>{ if(hits[k]>max){ max=hits[k]; best=k; } });
  return best;
}
function matchBranch(cfg, input){
  if(!cfg) return null;
  if(!input) return cfg.fallback;
  const text = input.toLowerCase().replace(/\s/g,'');
  const tone = analyzeTone(text);
  let best = null, bestScore = -1;
  for(const b of cfg.branches){
    let score = 0;
    if(b.keys && b.keys.length){
      const hit = b.keys.filter(k=>text.includes(k.toLowerCase())).length;
      if(hit === 0 && !b.tone) continue;
      score += hit * 2;
    }
    if(b.require && b.require.length){
      const allHit = b.require.every(k=>text.includes(k.toLowerCase()));
      if(!allHit) continue;
      score += b.require.length * 3;
    }
    if(b.tone && b.tone === tone) score += 2;
    if(b.priority) score += b.priority;
    if(score > bestScore){ bestScore = score; best = b; }
  }
  return best || cfg.fallback;
}

/* ===================== 渲染 ===================== */
const $=id=>document.getElementById(id);
const bgEl=$('bg'), speakerEl=$('speaker'), textEl=$('text'), choicesEl=$('choices'),
      nextHint=$('nextHint'), charEl=$('char'),
      customBox=$('customBox'), customInput=$('customInput');

function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}
function updateHUD(){
  $('idDisplay').textContent='ID: '+state.playerId;
  $('affection').textContent='好感 ♥ '+state.affection;
}
function setBG(k){ bgEl.style.background=BG[k]||BG.start; }

function typeText(str, cb){
  textEl.textContent=''; let i=0;
  clearInterval(window._typer);
  window._typer=setInterval(()=>{
    textEl.textContent+=str[i]||''; i++;
    if(i>=str.length){ clearInterval(window._typer); if(cb)cb(); }
  },24);
}

let dialogBoxClick=null;

function getChoices(node, key){
  let list = node.choices ? node.choices.slice() : [];
  if(key==='contract_end' && state.affection <= 12){
    if(!list.some(c=>c.flag==='coldStart')){
      list.push({ t:'“随便吧，反正一开始就是交易。”', aff:-6, next:'cage_trigger', flag:'coldStart', danger:true });
    }
  }
  return list;
}

function renderNode(key){
  const node=nodes[key];
  if(!node) return;
  state.node=key;
  setBG(node.bg||'start');
  charEl.style.opacity = node.char===false ? '0' : '.9';
  charEl.classList.toggle('tense', !!node.tense);

  if(node.speaker){
    speakerEl.textContent=node.speaker;
    speakerEl.className = node.cls==='zhang'?'zhang':(node.cls==='narr'?'narr':'');
  } else speakerEl.textContent='';

  if(node.isEnding){ showEnding(node); return; }

  choicesEl.innerHTML=''; nextHint.style.display='none'; dialogBoxClick=null;
  customBox.style.display='none'; customInput.value='';

  typeText(node.text, ()=>{
    const list = getChoices(node, key);
    if(list.length){
      list.forEach(c=>{
        const b=document.createElement('button');
        b.className='choice'+(c.danger?' danger':'');
        b.textContent=c.t;
        b.onclick=()=>{
          clickSound();
          state.affection+=(c.aff||0);
          if(c.flag) state.flags[c.flag]=true;
          if(c.heart) heartSound();
          if(c.danger) tenseSound();
          updateHUD(); renderNode(c.next);
        };
        choicesEl.appendChild(b);
      });
    }

    if(node.custom && customConfigs[node.custom]){
      const cfg = customConfigs[node.custom];
      customInput.placeholder = cfg.placeholder || '输入你想说的话……';
      customBox.style.display='flex';
    }

    if(!list.length && !node.custom && node.next){
      nextHint.style.display='block';
      const adv=()=>{ clickSound(); renderNode(node.next); };
      nextHint.onclick=adv; dialogBoxClick=adv;
    }
  });
}

$('customSend').onclick = ()=>{
  const input = customInput.value.trim();
  if(!input){ toast('说点什么吧'); return; }
  const cfg = customConfigs[nodes[state.node].custom];
  if(!cfg) return;
  clickSound();
  state.lastInput = input;
  const br = matchBranch(cfg, input);
  state.affection += (br.aff||0);
  if(br.flag) state.flags[br.flag]=true;
  if((br.aff||0) > 0) heartSound(); else if((br.aff||0) < 0) tenseSound();
  updateHUD();

  // 记录历史
  state.history.push({
    node: state.node,
    input: input,
    reply: br.reply,
    aff: br.aff||0
  });

  customBox.style.display='none';
  choicesEl.innerHTML='';
  speakerEl.textContent='张泽禹';
  speakerEl.className='zhang';
  typeText(br.reply, ()=>{
    nextHint.style.display='block';
    const adv=()=>{ clickSound(); renderNode(br.next); };
    nextHint.onclick=adv; dialogBoxClick=adv;
  });
};

$('customSkip').onclick = ()=>{
  const cfg = customConfigs[nodes[state.node].custom];
  if(!cfg) return;
  clickSound();
  state.flags.silentCustom = true;
  customBox.style.display='none';
  choicesEl.innerHTML='';
  speakerEl.textContent='';
  typeText('你沉默了很久，最终什么也没说。\n\n他等了一会儿，轻轻叹了口气。\n\n“……我知道了。”', ()=>{
    state.affection += 1;
    updateHUD();
    state.history.push({ node: state.node, input:'（沉默）', reply:'他等了一会儿，轻轻叹了口气。', aff:1 });
    nextHint.style.display='block';
    const adv=()=>{ clickSound(); renderNode(cfg.fallback.next); };
    nextHint.onclick=adv; dialogBoxClick=adv;
  });
};

$('dialogBox').addEventListener('click', e=>{
  if(e.target.classList.contains('choice')) return;
  if(e.target.closest('#customBox')) return;
  if(dialogBoxClick){ const f=dialogBoxClick; dialogBoxClick=null; f(); }
});

/* ===================== 结局判定 ===================== */
function showEnding(node){
  node = node || {};
  const f=state.flags, a=state.affection;
  let key;

  if(node.forceEnd){ key = node.forceEnd; }
  else if(f.cageEscape || f.breakout){ key = f.cageEscape ? 'cage' : 'cage_break'; }
  else if(a>=32 && (f.stay||f.refuse||f.stand||f.customYes||f.customLove||f.customStay) && (f.eye||f.silent||f.photo)) key='hidden_true';
  else if(a>=24) key='true_love';
  else if(a>=16 && f.sign) key='career';
  else if(a>=16) key='open_end';
  else if(a>=10 && (f.cold||f.customNo||f.customCold)) key='friend';
  else if(f.sign||f.cold||f.customNo||f.customCold) key='regret_be';
  else key='warm_be';

  state.lastEnding=key;
  const e=endings[key];
  $('endTitle').textContent=e.title;
  $('endText').textContent=e.text;
  $('endStat').textContent='最终好感 ♥ '+a+'  ·  ID：'+state.playerId+'  ·  输入记录 '+state.history.length+' 条';
  $('ending').style.display='flex';
  stopBGM();
  if(key==='hidden_true'||key==='true_love'||key==='cage'||key==='chase_good') goodSound();
  else setTimeout(()=>beep(420,0.4,'sine',0.07),150);
}

/* ===================== 设置 & 历史 ===================== */
$('btnSet').onclick=()=>{
  clickSound();
  $('inputId').value = state.playerId==='未命名'?'':state.playerId;
  $('avatarPreview').src = state.avatar||'';
  $('saveInfo').textContent = '当前进度：'+ state.node +' · 好感 '+state.affection;
  $('settings').style.display='flex';
};
$('btnCloseSet').onclick=()=>{ clickSound(); $('settings').style.display='none'; };
$('btnSave').onclick=()=>{
  const id=$('inputId').value.trim();
  if(id){ state.playerId=id; localStorage.setItem('hy_id',id); }
  updateHUD(); clickSound(); toast('已保存 ✓');
  $('settings').style.display='none';
};
$('inputAvatar').onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{ state.avatar=ev.target.result; $('avatarPreview').src=state.avatar;
    localStorage.setItem('hy_avatar',state.avatar); toast('头像已更新 ✓'); };
  r.readAsDataURL(file);
};
$('btnRestart').onclick=()=>{ clickSound(); resetGame(); };
$('btnAgain').onclick=()=>{ clickSound(); resetGame(); };
$('btnEndSet').onclick=()=>{ clickSound(); $('ending').style.display='none'; $('settings').style.display='flex'; };

/* 历史面板 */
$('btnHistory').onclick=()=>{
  clickSound();
  const list=$('historyList');
  if(!state.history.length){
    list.innerHTML='<div class="histItem">这一周目你还没有说过自定义的话。</div>';
  } else {
    list.innerHTML = state.history.map(h=>`
      <div class="histItem">
        <div class="h-node">📍 ${h.node}</div>
        <div class="h-in">你说：「${h.input}」</div>
        <div class="h-reply">他：${h.reply.replace(/\n/g,'<br>')}</div>
        <div style="font-size:11px;color:${h.aff>=0?'#7ecb8f':'#e07a8a'};margin-top:6px;">好感 ${h.aff>=0?'+':''}${h.aff}</div>
      </div>
    `).join('');
  }
  $('settings').style.display='none';
  $('historyPanel').style.display='flex';
};
$('btnCloseHistory').onclick=()=>{
  clickSound();
  $('historyPanel').style.display='none';
  $('settings').style.display='flex';
};

function resetGame(){
  state.affection=0; state.flags={}; state.node='start'; state.history=[];
  $('settings').style.display='none'; $('ending').style.display='none';
  $('historyPanel').style.display='none';
  updateHUD(); startBGM(); renderNode('start');
}

$('btnSound').onclick=()=>{
  soundOn=!soundOn;
  $('btnSound').textContent=soundOn?'🔊':'🔇';
  if(soundOn){ initAudio(); startBGM(); } else stopBGM();
};

/* ===================== 启动 ===================== */
window.addEventListener('load',()=>{
  const sid=localStorage.getItem('hy_id'), sav=localStorage.getItem('hy_avatar');
  if(sid) state.playerId=sid;
  if(sav) state.avatar=sav;
  document.body.addEventListener('click',function once(){
    initAudio(); startBGM(); document.body.removeEventListener('click',once);
  },{once:true});
  updateHUD(); renderNode('start');
});
</script>
